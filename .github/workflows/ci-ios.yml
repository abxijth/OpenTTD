name: CI (iOS)

on:
  workflow_call:
    inputs:
      extra-cmake-parameters:
        required: false
        type: string
        default: ""

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  ios:
    name: iOS (arm64)

    runs-on: macos-latest
    env:
      IOS_DEPLOYMENT_TARGET: "13.0"

    steps:
    - name: Setup Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Checkout
      uses: actions/checkout@v7

    - name: Build host tools
      run: |
        mkdir build-host
        cd build-host

        cmake .. -DOPTION_TOOLS_ONLY=ON
        cmake --build . -j $(sysctl -n hw.logicalcpu) --target strgen settingsgen

    - name: Build
      run: |
        mkdir build
        cd build

        echo "::group::CMake"
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=os/ios/toolchain_ios.cmake \
          -DIOS_PLATFORM=OS \
          -DCMAKE_BUILD_TYPE=Release \
          -DHOST_BINARY_DIR="$GITHUB_WORKSPACE/build-host" \
          ${{ inputs.extra-cmake-parameters }} \
          # EOF
        echo "::endgroup::"

        echo "::group::Build"
        echo "Running on $(sysctl -n hw.logicalcpu) cores"
        cmake --build . -j $(sysctl -n hw.logicalcpu)
        echo "::endgroup::"

    - name: Fetch base sets (OpenGFX/OpenSFX)
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p base-sets
        # The -all.zip files each contain a single base-set .tar, which OpenTTD
        # reads directly from Data/baseset/ (graphics+sounds support tars there).
        curl -fsSL https://cdn.openttd.org/opengfx-releases/8.0/opengfx-8.0-all.zip -o ogfx.zip
        unzip -o ogfx.zip -d .
        curl -fsSL https://cdn.openttd.org/opensfx-releases/1.0.3/opensfx-1.0.3-all.zip -o osfx.zip
        unzip -o osfx.zip -d .
        mv -f opengfx-8.0.tar opensfx-1.0.3.tar base-sets/

    - name: Assemble App Bundle
      run: os/ios/build_app.sh build build/app
      env:
        IOS_BASESET_TAR_DIR: ${{ github.workspace }}/base-sets

    - name: Sign App (ad-hoc)
      shell: bash
      run: |
        set -euxo pipefail
        APP="build/app/OpenTTD.app"
        test -f "$APP/openttd" || { echo "::error::$APP/openttd missing"; exit 1; }

        # Ad-hoc signature: no Apple Developer certificate is available in CI.
        # Sideloading tools (Sideloadly/AltStore/SideStore/TrollStore) re-sign
        # over this with the user's own identity at install time.
        codesign --force --deep --sign - --entitlements os/ios/entitlements.plist \
                --timestamp=none --verbose=4 "$APP"

        # Fail the job if the signature did not actually take.
        codesign --verify --deep --strict --verbose=4 "$APP"

        # Belt and braces: codesign -dv must not report an unsigned object.
        if codesign -dv "$APP" 2>&1 | grep -q "not signed at all"; then
            echo "::error::codesign -dv reports 'code object is not signed at all'"
            exit 1
        fi

        # Machine-parse the embedded signature blob: must exist, be non-empty
        # and carry the 0xfade0cc0 CSMAGIC_EMBEDDED_SIGNATURE magic.
        python3 os/ios/check_codesign.py "$APP/openttd"

    - name: Package IPA
      run: |
        cd build/app
        mkdir -p Payload
        cp -R OpenTTD.app Payload/
        rm -rf Payload/OpenTTD.app/__MACOSX Payload/OpenTTD.app/.DS_Store
        zip -qrX OpenTTD-iOS-arm64.ipa Payload

        # The archive must be a proper IPA: a Payload/ folder wrapping the .app.
        unzip -l OpenTTD-iOS-arm64.ipa | grep -q "Payload/OpenTTD.app" || {
            echo "::error::IPA is missing Payload/OpenTTD.app"
            exit 1
        }
        ls -la OpenTTD-iOS-arm64.ipa

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenTTD-iOS-arm64
        path: build/app/OpenTTD-iOS-arm64.ipa
        if-no-files-found: error
